<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录状态探测测试</title>
  <style>
    body { margin: 0; }
    [class*="navbar-head"] { width: 100vw; height: 72px; display: flex; align-items: center; }
    [class*="logo"] { width: 180px; }
    .nav-wrapper { display: flex; gap: 20px; flex: 1; }
    [class*="account"] { width: 140px; display: flex; justify-content: flex-end; }
    [class*="avatar"] { width: 36px; height: 36px; }
  </style>
</head>
<body>
  <div id="fixture"></div>
  <pre id="test-result">RUNNING</pre>
  <script src="../session-detector.js"></script>
  <script>
    (() => {
      const fixture = document.getElementById("fixture");
      const sunny = (account) => `
        <div class="navbar-gtb7 navbar-sd">
          <div class="navbar-head-nCSb">
            <div class="logo-m7u"><a href="/" title="首页">首页</a></div>
            <div class="nav-wrapper"><a href="/jobs">校园招聘</a><a href="/about">关于舜宇</a></div>
            <div class="account-q4V">${account}</div>
          </div>
        </div>`;
      fixture.innerHTML = sunny('<div class="avatar--10"><div class="avatar--name">许</div></div>');
      const loggedIn = JobAutofillSessionDetector.detect();
      fixture.innerHTML = sunny('<button type="button">登录 / 注册</button>');
      const loggedOut = JobAutofillSessionDetector.detect();
      fixture.innerHTML = "<main><h1>公开职位详情</h1><p>请投递简历</p></main>";
      const unknown = JobAutofillSessionDetector.detect();
      const checks = {
        sunny_logged_in: loggedIn.state === "logged-in" && loggedIn.confidence >= 0.9,
        sunny_logged_out: loggedOut.state === "logged-out",
        no_header_unknown: unknown.state === "unknown"
      };
      const passed = Object.values(checks).every(Boolean);
      document.body.dataset.testStatus = passed ? "passed" : "failed";
      document.getElementById("test-result").textContent = JSON.stringify({ passed, checks }, null, 2);
    })();
  </script>
</body>
</html>
